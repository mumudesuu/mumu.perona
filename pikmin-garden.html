<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 皮克敏花田手記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer onload="initGoogleSignIn()"></script>
<style>
  :root{
    --cream:#FFF6E8;
    --cream-deep:#FBE9CC;
    --leaf:#3E9166;
    --leaf-deep:#276148;
    --ink:#2B4636;
    --pink:#FF7FA8;
    --pink-deep:#E85D8D;
    --yellow:#FFC93C;
    --yellow-deep:#D6A014;
    --sky:#5FC1DE;
    --sky-deep:#2E93B2;
    --purple:#B080E0;
    --purple-deep:#8C57C4;
    --white:#FFFFFF;
    --danger:#E85D5D;
    --card-shadow: 0 7px 0 rgba(39,97,72,.13);
    --soft-shadow: 0 4px 0 rgba(39,97,72,.10);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 8% 12%, rgba(255,201,60,.20), transparent 30%),
      radial-gradient(circle at 92% 10%, rgba(255,127,168,.18), transparent 32%),
      radial-gradient(circle at 50% 92%, rgba(95,193,222,.16), transparent 36%),
      var(--cream);
    color:var(--ink);
    font-family:'Zen Maru Gothic','Noto Sans TC',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    padding:0 0 80px;
  }

  .float{
    position:fixed; z-index:0; pointer-events:none; opacity:.55;
    font-size:clamp(22px,3vw,34px);
    animation:floating 7s ease-in-out infinite;
  }
  .f1{top:8%; left:4%;}
  .f2{top:25%; right:5%; animation-delay:1s;}
  .f3{top:62%; left:2%; animation-delay:2s;}
  .f4{bottom:12%; right:6%; animation-delay:3s;}
  .f5{top:45%; right:1%; font-size:20px; animation-delay:1.8s;}
  @keyframes floating{
    0%,100%{transform:translateY(0) rotate(-5deg);}
    50%{transform:translateY(-20px) rotate(7deg);}
  }

  header{
    position:relative; z-index:1;
    max-width:1080px; margin:0 auto;
    padding:40px 24px 22px;
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:20px; flex-wrap:wrap;
  }
  .brand-eyebrow{
    font-family:'Baloo 2', sans-serif;
    font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--leaf-deep); margin:0 0 6px; font-weight:700;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:34px;
    margin:0;
    color:var(--leaf-deep);
    line-height:1.15;
    letter-spacing:.5px;
    text-shadow:3px 3px 0 var(--white);
  }
  h1 span{color:var(--pink-deep);}
  .sub{color:#648070; font-size:14.5px; margin-top:8px; max-width:440px; line-height:1.8;}

  .head-actions{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    width:42px; height:42px; border-radius:14px;
    background:var(--white); border:2px solid var(--cream-deep);
    box-shadow:var(--card-shadow);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer;
    transition:transform .1s ease;
  }
  .icon-btn:hover{transform:translateY(-2px);}
  .icon-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(39,97,72,0.14);}
  .icon-btn.spinning{animation:spin .6s linear;}
  @keyframes spin{from{transform:rotate(0);} to{transform:rotate(360deg);}}
  .sync-pill{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:11px;
    padding:6px 12px; border-radius:20px;
    display:flex; align-items:center; gap:6px;
  }
  .sync-pill.ok{background:#E4F4EA; color:var(--leaf-deep);}
  .sync-pill.off{background:#FBE9CC; color:var(--yellow-deep);}
  .dot{width:7px; height:7px; border-radius:50%; background:currentColor;}

  main{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:10px 24px;}

  .settings-panel{display:none;}

  .add-bar{
    display:flex; gap:10px; margin-bottom:26px; flex-wrap:wrap;
  }
  .add-bar input{
    flex:1; min-width:220px;
    background:var(--white);
    border:2px solid var(--cream-deep);
    color:var(--ink);
    border-radius:14px;
    padding:13px 16px;
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:15px;
    font-weight:700;
    outline:none;
  }
  .add-bar input::placeholder{color:#A9BBAE; font-weight:600;}
  .add-bar input:focus{border-color:var(--leaf);}
  .add-btn{
    background:var(--leaf);
    color:var(--white);
    border:none;
    border-radius:14px;
    padding:0 22px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:15.5px;
    cursor:pointer;
    box-shadow:0 5px 0 var(--leaf-deep);
    transition:transform .08s ease;
  }
  .add-btn:hover{transform:translateY(-1px);}
  .add-btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--leaf-deep);}

  .filter-tabs{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  .filter-tab{
    background:var(--white);
    border:2px solid var(--cream-deep);
    color:var(--ink);
    border-radius:20px;
    padding:7px 16px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .filter-tab:hover{border-color:var(--leaf);}
  .filter-tab.active{background:var(--leaf); border-color:var(--leaf); color:var(--white);}

  .search-bar{position:relative; margin-bottom:14px;}
  .search-bar input{
    width:100%;
    background:var(--white);
    border:2px solid var(--cream-deep);
    color:var(--ink);
    border-radius:14px;
    padding:11px 16px 11px 40px;
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:14px;
    font-weight:700;
    outline:none;
  }
  .search-bar input::placeholder{color:#A9BBAE; font-weight:600;}
  .search-bar input:focus{border-color:var(--leaf);}
  .search-bar .search-icon{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    font-size:15px; pointer-events:none;
  }
  .search-bar .search-clear{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:#9AAB9F; cursor:pointer;
    font-size:15px; padding:4px; display:none;
  }
  .search-bar .search-clear:hover{color:var(--danger);}
  .search-bar.has-value .search-clear{display:block;}

  .settings-panel{
    background:var(--white);
    border:2px solid var(--cream-deep);
    border-radius:18px;
    padding:18px 20px;
    margin-bottom:24px;
    display:none;
    box-shadow:var(--card-shadow);
  }
  .settings-panel.open{display:block;}
  .settings-panel label{
    font-family:'Baloo 2',sans-serif; font-weight:600; font-size:14px; color:var(--ink);
    display:block; margin-bottom:8px;
  }
  .settings-row{display:flex; gap:10px; flex-wrap:wrap;}
  .settings-row input{
    flex:1; min-width:240px;
    background:var(--cream);
    border:2px solid var(--cream-deep);
    border-radius:12px;
    padding:10px 14px;
    font-family:'Zen Maru Gothic',monospace;
    font-size:12.5px;
    color:var(--ink);
    outline:none;
  }
  .settings-row input:focus{border-color:var(--sky);}
  .settings-btn{
    background:var(--ink); color:var(--white); border:none;
    border-radius:12px; padding:0 18px; font-weight:700; font-size:13.5px;
    cursor:pointer; font-family:'Zen Maru Gothic',sans-serif;
  }
  .settings-hint{font-size:12.5px; color:#7E9484; margin-top:10px; line-height:1.6;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
    gap:20px;
  }
  .empty{text-align:center; padding:70px 20px; color:#7E9484;}
  .empty .big{font-family:'Baloo 2',sans-serif; font-size:19px; color:var(--ink); margin-bottom:6px;}

  .card{
    background:var(--white);
    border:2px solid var(--cream-deep);
    border-radius:20px;
    padding:20px 20px 18px;
    display:flex; flex-direction:column; gap:14px;
    box-shadow:var(--card-shadow);
    transition:transform .1s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .card.cooling{border-color:var(--sky); box-shadow:0 6px 0 rgba(46,147,178,0.24);}
  .card.highlight-flash{
    position:relative; z-index:2;
    outline:4px solid var(--purple);
    outline-offset:3px;
    box-shadow:0 8px 0 rgba(176,128,224,.5);
    transition:outline-color .4s ease, box-shadow .4s ease;
  }

  .card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .name-row{display:flex; align-items:center; gap:6px;}
  .name-pin{font-size:15px; flex-shrink:0;}
  .field-name{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px;
    background:transparent; border:none; color:var(--ink); outline:none; width:100%; padding:0;
  }
  .field-meta{font-family:'Zen Maru Gothic',sans-serif; font-size:10.5px; color:#9AAB9F; margin-top:4px; margin-left:21px;}
  .del-btn{
    background:var(--cream); border:none; color:#9AAB9F;
    cursor:pointer; font-size:15px; line-height:1; width:30px; height:30px;
    border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .del-btn:hover{color:var(--danger); background:#FCE4E4;}

  .status-pill{
    align-self:flex-start;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:11.5px;
    padding:5px 12px; border-radius:20px;
    margin-top:-6px;
  }
  .status-pill.idle{background:#EAF6EE; color:var(--leaf-deep);}
  .status-pill.cooling{background:#E4F3F8; color:var(--sky-deep);}

  .category-row{display:flex; gap:6px; flex-wrap:wrap;}
  .category-chip{
    background:var(--cream);
    border:2px solid var(--cream-deep);
    color:#9AAB9F;
    border-radius:20px;
    padding:5px 12px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:11.5px;
    cursor:pointer;
  }
  .category-chip:hover{border-color:var(--purple);}
  .category-chip.active{background:var(--purple); border-color:var(--purple); color:var(--white);}

  .harvest-check-row{
    display:flex; align-items:center; gap:8px;
    cursor:pointer;
    padding-top:4px;
  }
  .harvest-check-row input[type="checkbox"]{
    width:19px; height:19px; accent-color:var(--yellow-deep); cursor:pointer;
  }
  .harvest-check-label{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink);
  }

  .species-row{display:flex; align-items:center; gap:8px;}
  .species-label{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px;
    color:var(--ink); flex-shrink:0; white-space:nowrap;
  }
  .species-input{
    width:100%;
    background:var(--cream);
    border:2px solid var(--cream-deep);
    border-radius:11px;
    padding:9px 12px;
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    outline:none;
  }
  .species-input::placeholder{color:#A9BBAE; font-weight:600;}
  .species-input:focus{border-color:var(--purple);}

  .coords-row{display:flex; align-items:center; gap:8px;}
  .coords-label{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px;
    color:var(--ink); flex-shrink:0; white-space:nowrap;
  }
  .coords-input{
    width:100%;
    background:var(--cream);
    border:2px solid var(--cream-deep);
    border-radius:11px;
    padding:9px 12px;
    font-family:'Baloo 2','Zen Maru Gothic',monospace;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink);
    outline:none;
  }
  .coords-input::placeholder{color:#A9BBAE; font-weight:600; font-family:'Zen Maru Gothic',sans-serif;}
  .coords-input:focus{border-color:var(--sky);}
  .coords-copy-btn{
    background:var(--sky);
    color:var(--white);
    border:none;
    border-radius:9px;
    width:34px; height:34px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    cursor:pointer;
  }
  .coords-copy-btn:hover{background:var(--sky-deep);}
  .coords-copy-btn.copied{background:var(--leaf);}

  .drivelink-row{display:flex; align-items:center; gap:8px;}
  .drivelink-label{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px;
    color:var(--purple-deep); flex-shrink:0; white-space:nowrap;
  }
  .drivelink-input{
    width:100%;
    background:#F6EFFC;
    border:2px solid #E4D3F5;
    border-radius:11px;
    padding:9px 12px;
    font-family:'Baloo 2','Zen Maru Gothic',monospace;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink);
    outline:none;
  }
  .drivelink-input::placeholder{color:#B8A0D6; font-weight:600; font-family:'Zen Maru Gothic',sans-serif;}
  .drivelink-input:focus{border-color:var(--purple);}
  .drivelink-copy-btn{
    background:var(--purple);
    color:var(--white);
    border:none;
    border-radius:9px;
    width:34px; height:34px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    cursor:pointer;
  }
  .drivelink-copy-btn:hover{background:var(--purple-deep);}
  .drivelink-copy-btn.copied{background:var(--leaf);}

  .copy-info-btn{
    width:100%;
    background:var(--white);
    border:2px solid var(--cream-deep);
    color:var(--ink);
    border-radius:12px;
    padding:10px 0;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .copy-info-btn:hover{border-color:var(--leaf); background:var(--cream);}
  .copy-info-btn.copied{border-color:var(--leaf); background:#EAF6EE; color:var(--leaf-deep);}

  .local-time-row{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:#7E9484;
    padding:0 2px;
  }
  .local-time-icon{font-size:13px;}
  .local-time-text{font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--ink); font-size:13px;}
  .local-time-utc{
    font-family:'Baloo 2',sans-serif; font-weight:700; color:#9AAB9F; font-size:10.5px;
    background:var(--cream); padding:2px 7px; border-radius:10px;
  }

  .add-bar-coords{
    background:var(--white);
    border:2px solid var(--cream-deep);
    color:var(--ink);
    border-radius:14px;
    padding:13px 16px;
    font-family:'Baloo 2','Zen Maru Gothic',monospace;
    font-size:14px;
    font-weight:700;
    outline:none;
    flex:1;
    min-width:180px;
  }
  .add-bar-coords::placeholder{color:#A9BBAE; font-weight:600; font-family:'Zen Maru Gothic',sans-serif;}
  .add-bar-coords:focus{border-color:var(--sky);}

  .add-bar-category{
    background:var(--white);
    border:2px solid var(--cream-deep);
    color:var(--ink);
    border-radius:14px;
    padding:13px 16px;
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:14px;
    font-weight:700;
    outline:none;
    cursor:pointer;
    min-width:140px;
  }
  .add-bar-category:focus{border-color:var(--purple);}

  .timer-box{border-top:2px dashed var(--cream-deep); padding-top:14px; display:flex; flex-direction:column; gap:10px;}
  .timer-label{font-size:11.5px; color:#9AAB9F; font-weight:700; letter-spacing:.02em;}
  .preset-row{display:flex; gap:8px;}
  .preset-btn{
    flex:1;
    background:var(--cream);
    border:2px solid var(--cream-deep);
    color:var(--ink);
    border-radius:11px;
    padding:8px 4px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .preset-btn:hover{border-color:var(--sky); background:#EAF7FB;}
  .custom-toggle{
    align-self:flex-start;
    background:none; border:none; color:var(--purple-deep);
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:12.5px;
    cursor:pointer; padding:2px 0;
  }
  .custom-toggle:hover{text-decoration:underline;}
  .custom-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .custom-input{
    width:56px;
    background:var(--cream);
    border:2px solid var(--cream-deep);
    border-radius:9px;
    padding:7px 6px;
    text-align:center;
    font-family:'Baloo 2',sans-serif;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    outline:none;
  }
  .custom-input:focus{border-color:var(--purple);}
  .custom-row span{font-size:12px; color:#9AAB9F; font-weight:700;}
  .timer-btn{
    background:var(--purple);
    color:var(--white);
    border:none;
    border-radius:9px;
    padding:7px 14px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:12.5px;
    cursor:pointer;
    margin-left:auto;
  }
  .timer-btn:hover{background:var(--purple-deep);}
  .timer-active-row{display:flex; align-items:center; justify-content:space-between;}
  .timer-display{
    font-family:'Baloo 2',sans-serif; font-size:24px; font-weight:700; color:var(--sky-deep);
  }
  .clear-btn{
    background:none; border:none; color:#9AAB9F; font-size:12px; font-weight:700; cursor:pointer;
    text-decoration:underline;
  }
  .clear-btn:hover{color:var(--danger);}

  .role-tag{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:11px;
    padding:6px 12px; border-radius:20px;
    display:none; align-items:center; gap:6px;
    background:#F2E9FB; color:var(--purple-deep);
  }

  .modal-overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(43,70,54,0.45);
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--white);
    border-radius:22px;
    padding:30px 26px 26px;
    max-width:320px; width:100%;
    text-align:center;
    box-shadow:var(--card-shadow);
    position:relative;
  }
  .modal-box .modal-icon{font-size:36px; margin-bottom:6px;}
  .modal-box h3{
    font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--leaf-deep);
    margin:0 0 8px; font-size:19px;
  }
  .modal-box p{font-size:13px; color:#789080; margin:0 0 20px; line-height:1.7;}
  .modal-close{
    position:absolute; top:12px; right:14px;
    background:none; border:none; font-size:18px; color:#9AAB9F; cursor:pointer;
  }
  .modal-close:hover{color:var(--danger);}
  #googleBtnContainer{display:flex; justify-content:center; min-height:44px;}

  .passcode-gate{
    position:fixed; inset:0; z-index:9999;
    background:
      radial-gradient(circle at 8% 12%, rgba(255,201,60,.20), transparent 30%),
      radial-gradient(circle at 92% 10%, rgba(255,127,168,.18), transparent 32%),
      radial-gradient(circle at 50% 92%, rgba(95,193,222,.16), transparent 36%),
      var(--cream);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .passcode-box{
    background:var(--white);
    border-radius:22px;
    padding:36px 30px 30px;
    max-width:320px; width:100%;
    text-align:center;
    box-shadow:var(--card-shadow);
  }
  .passcode-box .gate-icon{font-size:40px; margin-bottom:8px;}
  .passcode-box h3{
    font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--leaf-deep);
    margin:0 0 8px; font-size:20px;
  }
  .passcode-box p{font-size:13px; color:#789080; margin:0 0 20px; line-height:1.7;}
  .passcode-input{
    width:100%;
    background:var(--cream);
    border:2px solid var(--cream-deep);
    border-radius:12px;
    padding:12px 14px;
    font-family:'Baloo 2',sans-serif;
    font-size:20px;
    font-weight:700;
    letter-spacing:6px;
    text-align:center;
    color:var(--ink);
    outline:none;
  }
  .passcode-input:focus{border-color:var(--leaf);}
  .passcode-error{
    display:none; color:var(--danger); font-size:12.5px; font-weight:700;
    margin-top:8px;
  }
  .passcode-submit{
    width:100%; margin-top:14px;
    background:var(--leaf); color:var(--white); border:none;
    border-radius:12px; padding:11px 0;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14.5px;
    cursor:pointer;
    box-shadow:0 5px 0 var(--leaf-deep);
    transition:transform .08s ease;
  }

<script>
const APIURL_KEY = 'pikmin-api-url';
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbw8nn7gI0n6-w72t4LfKRzOHguOeuaZVqNiKbouJqKbm_3owUNO-ATpdqrd6LNU0pSQ/exec';
// 從 Google Cloud Console 建立的 OAuth 用戶端 ID，貼在這裡（結尾是 .apps.googleusercontent.com）
const GOOGLE_CLIENT_ID = '1001037373208-3sdt3t6aekf1v0efidd53ob62m92t2nl.apps.googleusercontent.com';
const ADMIN_EMAIL = 'sandy36095@gmail.com';
const ADMIN_TOKEN_KEY = 'pikmin-admin-token';
const DEVICE_TRUST_KEY = 'pikmin-device-trusted';
const PRESETS = [
  { label:'23 小時', minutes: 23*60 },
  { label:'6 小時', minutes: 6*60 },
  { label:'3 小時', minutes: 3*60 }
];
const BASELINE_MINUTES = Math.max(...PRESETS.map(p => p.minutes));
const CATEGORIES = ['沐田', '達醬', '柴田', 'Kiwi', '其他', '暫存'];
let apiUrl = DEFAULT_API_URL;
let fields = [];
let initialLoading = true;
let mergedLog = [];
let logExpanded = false;
let pollHandle = null;
let tickHandle = null;
let adminMode = false;
let adminIdToken = '';
let customOpenIds = new Set();
let selectedCategories = new Set();
let selectedLogCategories = new Set();
let currentSearch = '';
let pendingWrites = {};

function markPending(id, keys){
  if(!pendingWrites[id]) pendingWrites[id] = new Set();
  keys.forEach(k => pendingWrites[id].add(k));
}
function clearPending(id, keys){
  if(!pendingWrites[id]) return;
  keys.forEach(k => pendingWrites[id].delete(k));
  if(pendingWrites[id].size === 0) delete pendingWrites[id];
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function setSyncStatus(ok){
  const pill = document.getElementById('syncPill');
  if(ok){
    pill.className = 'sync-pill ok';
    pill.innerHTML = '<span class="dot"></span>已同步';
  }else{
    pill.className = 'sync-pill off';
    pill.innerHTML = '<span class="dot"></span>尚未連接';
  }
}

/* ---------- Google 登入 ---------- */

function decodeJwt(token){
  try{
    const payload = token.split('.')[1];
    const json = decodeURIComponent(
      atob(payload.replace(/-/g,'+').replace(/_/g,'/'))
        .split('')
        .map(c => '%' + ('00'+c.charCodeAt(0).toString(16)).slice(-2))
        .join('')
    );
    return JSON.parse(json);
  }catch(e){ return null; }
}

function isTokenValid(token){
  const payload = decodeJwt(token);
  if(!payload) return false;
  if(payload.email !== ADMIN_EMAIL || !payload.email_verified) return false;
  if(payload.exp * 1000 < Date.now()) return false;
  return true;
}

function initGoogleSignIn(){
  if(!window.google || !google.accounts || !google.accounts.id) return;
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(
    document.getElementById('googleBtnContainer'),
    { theme:'outline', size:'large', shape:'pill', text:'signin_with' }
  );
}

async function handleCredentialResponse(response){
  const token = response.credential;
  if(isTokenValid(token)){
    adminIdToken = token;
    adminMode = true;
    try{ localStorage.setItem(ADMIN_TOKEN_KEY, token); }catch(e){}
    toast('已用管理員帳號登入');
    closeLoginModal();
    updateAdminUI();
    try{
      if(localStorage.getItem(DEVICE_TRUST_KEY) !== 'true'){
        if(confirm('要記住這台裝置嗎？記住後，下次開啟這個網站不需要再輸入通關密語。')){
          localStorage.setItem(DEVICE_TRUST_KEY, 'true');
          toast('已記住這台裝置');
        }
      }
    }catch(e){}
  }else{
    toast('這個 Google 帳號沒有管理員權限');
    if(window.google) google.accounts.id.disableAutoSelect();
  }
}

function loadAdminState(){
  try{
    const token = localStorage.getItem(ADMIN_TOKEN_KEY);
    if(token && isTokenValid(token)){
      adminIdToken = token;
      adminMode = true;
    }
  }catch(e){}
  updateAdminUI();
}

function openLoginModal(){ document.getElementById('loginModal').classList.add('open'); }
function closeLoginModal(){ document.getElementById('loginModal').classList.remove('open'); }

function updateAdminUI(){
  const btn = document.getElementById('adminToggle');
  const tag = document.getElementById('roleTag');
  if(adminMode){
    btn.textContent = '🔓';
    btn.title = '登出管理員';
    tag.style.display = 'flex';
  }else{
    btn.textContent = '🔒';
    btn.title = '管理員登入';
    tag.style.display = 'none';
  }
  render();
}

document.getElementById('adminToggle').addEventListener('click', ()=>{
  if(adminMode){
    if(confirm('要登出管理員模式嗎？')){
      adminMode = false;
      adminIdToken = '';
      try{ localStorage.removeItem(ADMIN_TOKEN_KEY); }catch(e){}
      if(window.google) google.accounts.id.disableAutoSelect();
      updateAdminUI();
      try{
        if(localStorage.getItem(DEVICE_TRUST_KEY) === 'true'){
          if(confirm('要一併取消這台裝置的通關密語豁免嗎？取消後，下次開啟就需要重新輸入通關密語。')){
            localStorage.removeItem(DEVICE_TRUST_KEY);
          }
        }
      }catch(e){}
    }
  }else{
    openLoginModal();
  }
});
document.getElementById('loginModalClose').addEventListener('click', closeLoginModal);
document.getElementById('loginModal').addEventListener('click', e=>{
  if(e.target.id === 'loginModal') closeLoginModal();
});
document.getElementById('refreshBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  await fetchFields();
  toast('已重新整理');
  setTimeout(()=>btn.classList.remove('spinning'), 500);
});

function loadApiUrl(){
  fetchFields();
  startPolling();
}

function startPolling(){
  if(pollHandle) clearInterval(pollHandle);
  pollHandle = setInterval(fetchFields, 6000);
}

function isEditingField(){
  const el = document.activeElement;
  if(!el || !el.closest) return false;
  const inGrid = el.closest('#grid');
  const inAddBar = el.closest('.add-bar');
  return (inGrid || inAddBar) && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
}

async function fetchFields(){
  if(!apiUrl) return;
  try{
    const url = apiUrl + '?t=' + Date.now();
    const res = await fetch(url);
    const data = await res.json();
    if(data.ok){
      fields = data.fields.map(f => {
        const merged = {
          id: f.id,
          name: f.name,
          species: f.species || '',
          coords: f.coords || '',
          driveLink: f.driveLink || '',
          category: f.category || '其他',
          harvest: f.harvest === true || f.harvest === 'TRUE',
          fridge: f.fridge === true || f.fridge === 'TRUE',
          ready: f.ready === true || f.ready === 'TRUE',
          createdAt: Number(f.createdAt) || Date.now(),
          timerEnd: f.timerEnd ? Number(f.timerEnd) : null,
          timerMinutes: f.timerMinutes ? Number(f.timerMinutes) : null
        };
        if(pendingWrites[f.id]){
          const existing = fields.find(x => x.id === f.id);
          if(existing){
            pendingWrites[f.id].forEach(key => { merged[key] = existing[key]; });
          }
        }
        return merged;
      }).sort((a,b) => {
        const aCooling = a.timerEnd !== null;
        const bCooling = b.timerEnd !== null;
        if(aCooling !== bCooling) return aCooling ? -1 : 1;
        if(aCooling && bCooling) return a.timerEnd - b.timerEnd;
        return a.name.localeCompare(b.name, 'zh-Hant', { numeric: true });
      });
      mergedLog = (data.plantLog || []).map(l => ({
        fieldId: l.fieldId,
        fieldName: l.fieldName,
        species: l.species || '',
        plantedAt: Number(l.plantedAt) || 0,
        harvested: l.harvested === true || l.harvested === 'TRUE'
      })).sort((a,b) => b.plantedAt - a.plantedAt);
      setSyncStatus(true);
      initialLoading = false;
      if(!isEditingField()) render();
      renderMergedLog();
    }
  }catch(e){
    setSyncStatus(false);
    initialLoading = false;
    if(!isEditingField()) render();
  }
}

async function callApi(payload){
  if(!apiUrl){ toast('請先在設定裡貼上 Web App 網址'); return null; }
  try{
    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    return await res.json();
  }catch(e){
    toast('連線失敗，請檢查網路或網址');
    return null;
  }
}

async function addField(name, coords, category){
  const tempId = 'temp' + Date.now();
  const finalCategory = category || '暫存';
  fields.unshift({
    id: tempId, name, species:'', coords: coords || '', driveLink:'', category: finalCategory,
    harvest:false, fridge:false, ready:false,
    createdAt: Date.now(), timerEnd:null, timerMinutes:null
  });
  render();
  const result = await callApi({action:'add', name, coords: coords || '', category: category || ''});
  if(result && result.ok && result.id){
    const f = fields.find(x=>x.id===tempId);
    if(f) f.id = result.id;
  }
}
async function deleteField(id){
  fields = fields.filter(f => f.id !== id);
  render();
  callApi({action:'delete', id});
}
async function renameField(id, name){
  callApi({action:'rename', id, name: name.trim() || '未命名花田'});
}
async function setSpecies(id, species){
  const trimmed = species.trim();
  callApi({action:'setSpecies', id, species: trimmed});
  const f = fields.find(x=>x.id===id);
  const isCountingDown = f && f.timerEnd !== null && f.timerEnd > Date.now();
  if(isCountingDown){
    const entry = mergedLog.find(l => l.fieldId === id);
    if(entry){ entry.species = trimmed; renderMergedLog(); }
  }
}
async function setCoords(id, coords){
  callApi({action:'setCoords', id, coords: coords.trim()});
}
async function setDriveLink(id, driveLink){
  if(!adminMode) return;
  callApi({action:'setDriveLink', id, driveLink: driveLink.trim(), idToken: adminIdToken});
}
async function setCategory(id, category){
  const f = fields.find(x=>x.id===id);
  if(f) f.category = category;
  markPending(id, ['category']);
  render();
  await callApi({action:'setCategory', id, category});
  clearPending(id, ['category']);
}
async function toggleStage(id, key){
  if(!adminMode) return;
  const f = fields.find(x=>x.id===id);
  if(f) f[key] = !f[key];
  markPending(id, [key]);
  if(key === 'harvest' && f){
    const entry = mergedLog.find(l => l.fieldId === id);
    if(entry){ entry.harvested = f.harvest; renderMergedLog(); }
  }
  render();
  const result = await callApi({action:'toggleStage', id, key, idToken: adminIdToken});
  clearPending(id, [key]);
  if(result && result.ok === false){
    if(f) f[key] = !f[key];
    if(key === 'harvest' && f){
      const entry = mergedLog.find(l => l.fieldId === id);
      if(entry){ entry.harvested = f.harvest; renderMergedLog(); }
    }
    render();
    if(result.error === 'unauthorized'){
      toast('驗證失敗：' + (result.reason || '未知原因'));
      console.warn('toggleStage unauthorized, reason:', result.reason);
      adminMode = false;
      adminIdToken = '';
      try{ localStorage.removeItem(ADMIN_TOKEN_KEY); }catch(e){}
      updateAdminUI();
    }else{
      toast('操作失敗，請稍後再試');
    }
  }
}
async function startTimer(id, minutes, plantedAt){
  const f = fields.find(x=>x.id===id);
  if(f){ f.timerEnd = Date.now() + minutes*60000; f.timerMinutes = minutes; }
  customOpenIds.delete(id);
  markPending(id, ['timerEnd','timerMinutes']);
  render();
  await callApi({action:'startTimer', id, minutes, plantedAt: plantedAt || Date.now()});
  clearPending(id, ['timerEnd','timerMinutes']);
}
async function clearTimer(id){
  const f = fields.find(x=>x.id===id);
  if(f){ f.timerEnd = null; f.timerMinutes = null; f.species = ''; f.harvest = false; }
  markPending(id, ['timerEnd','timerMinutes','species','harvest']);
  render();
  await Promise.all([
    callApi({action:'clearTimer', id}),
    callApi({action:'setSpecies', id, species: ''})
  ]);
  clearPending(id, ['timerEnd','timerMinutes','species','harvest']);
}

function formatDate(ts){
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function formatDuration(min){
  const h = Math.floor(min/60);
  const m = min%60;
  if(h>0 && m>0) return `${h}小時${m}分`;
  if(h>0) return `${h}小時`;
  return `${m}分`;
}
function formatCountdown(ms){
  if(ms <= 0) return '00:00:00';
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function parseCoords(str){
  if(!str) return null;
  const matches = str.match(/-?\d+(\.\d+)?/g);
  if(!matches || matches.length < 2) return null;
  const lat = parseFloat(matches[0]);
  const lng = parseFloat(matches[1]);
  if(isNaN(lat) || isNaN(lng)) return null;
  if(Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return { lat, lng };
}
function utcOffsetFromLng(lng){
  let offset = Math.round(lng / 15);
  if(offset > 14) offset = 14;
  if(offset < -12) offset = -12;
  return offset;
}
function formatLocalTime(lng){
  const offset = utcOffsetFromLng(lng);
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  const local = new Date(utcMs + offset * 3600000);
  const hh = String(local.getHours()).padStart(2,'0');
  const mm = String(local.getMinutes()).padStart(2,'0');
  return `${local.getMonth()+1}/${local.getDate()} ${hh}:${mm}`;
}
function localTimeBlock(f){
  const c = parseCoords(f.coords);
  if(!c) return '';
  const offset = utcOffsetFromLng(c.lng);
  return `
    <div class="local-time-row" data-role="local-time-row" data-lng="${c.lng}">
      <span class="local-time-icon">🕐</span>
      <span class="local-time-text" data-role="local-time">${formatLocalTime(c.lng)}</span>
      <span class="local-time-utc">約 UTC${offset>=0?'+':''}${offset}</span>
    </div>`;
}

async function copyHarvestInfo(id, btnEl){
  const f = fields.find(x=>x.id===id);
  if(!f) return;
  const c = parseCoords(f.coords);
  const localTimeStr = c ? formatLocalTime(c.lng) : '—';
  const hasTimer = !!f.timerEnd;
  const remaining = hasTimer ? formatCountdown(f.timerEnd - Date.now()) : '無倒數';
  let text = `${f.name} \n當地時間🕰️${localTimeStr}\n\n花種：${f.species || ''}\n地點：${f.coords || ''}\n剩餘：${remaining}`;
  if(adminMode){
    text += `\n\n路徑：${f.driveLink || ''}`;
  }
  try{
    await navigator.clipboard.writeText(text);
  }catch(err){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  toast('已複製收成資訊');
  if(btnEl){
    btnEl.classList.add('copied');
    setTimeout(()=>btnEl.classList.remove('copied'), 1200);
  }
}

function cardTemplate(f){
  const hasTimer = !!f.timerEnd;
  const remaining = hasTimer ? f.timerEnd - Date.now() : 0;
  const customOpen = customOpenIds.has(f.id);

  const statusClass = hasTimer ? 'cooling' : 'idle';
  const statusLabel = hasTimer ? '❄️ 冷卻中' : '🟢 空閒中';
  const cardStateClass = hasTimer ? 'cooling' : '';

  return `
  <div class="card ${cardStateClass}" data-id="${f.id}">
    <div class="card-head">
      <div style="flex:1; min-width:0;">
        <div class="name-row">
          <span class="name-pin">📍</span>
          <input class="field-name" value="${escapeHtml(f.name)}" data-role="name" maxlength="24">
        </div>
        <div class="field-meta">建立於 ${formatDate(f.createdAt)}</div>
      </div>
      <button class="del-btn" data-role="delete" title="刪除花田">🗑</button>
    </div>

    <span class="status-pill ${statusClass}">${statusLabel}</span>

    <div class="category-row">
      ${CATEGORIES.map(c => `<button class="category-chip ${f.category===c?'active':''}" data-role="category" data-category="${c}" type="button">${c}</button>`).join('')}
    </div>

    <div class="species-row">
      <span class="species-label">花種🌸</span>
      <input class="species-input" data-role="species" placeholder="選填" value="${escapeHtml(f.species)}" maxlength="20">
    </div>

    <div class="coords-row">
      <span class="coords-label">座標🧭</span>
      <input class="coords-input" data-role="coords" placeholder="選填" value="${escapeHtml(f.coords || '')}" maxlength="60">
      <button class="coords-copy-btn" data-role="copy-coords" type="button" title="複製座標">📋</button>
    </div>
    ${localTimeBlock(f)}

    ${adminMode ? `
    <div class="drivelink-row">
      <span class="drivelink-label">☁️ 雲端</span>
      <input class="drivelink-input" data-role="drivelink" placeholder="貼上雲端連結" value="${escapeHtml(f.driveLink || '')}">
      <button class="drivelink-copy-btn" data-role="copy-drivelink" type="button" title="複製雲端連結">📋</button>
    </div>
    ` : ''}

    <div class="timer-box">
      ${hasTimer ? `
        <div class="timer-active-row">
          <span class="timer-label">冷藏倒數 · ${formatDuration(f.timerMinutes)}</span>
          <button class="clear-btn" data-role="clear-timer">清除倒數</button>
        </div>
        <div class="timer-display" data-role="countdown">${formatCountdown(remaining)}</div>
      ` : `
        <span class="timer-label">冷藏倒數</span>
        <div class="preset-row">
          ${PRESETS.map(p => `<button class="preset-btn" data-role="start-timer" data-minutes="${p.minutes}">${p.label}</button>`).join('')}
        </div>
        <button class="custom-toggle" data-role="toggle-custom" type="button">${customOpen ? '收起自訂倒數' : '⏱ 自訂倒數'}</button>
        ${customOpen ? `
        <div class="custom-row">
          <input type="number" min="0" max="999" class="custom-input" data-role="custom-h" placeholder="0">
          <span>時</span>
          <input type="number" min="0" max="59" class="custom-input" data-role="custom-m" placeholder="0">
          <span>分</span>
          <button class="timer-btn" data-role="start-custom" type="button">開始</button>
        </div>` : ''}
      `}
    </div>

    <button class="copy-info-btn" data-role="copy-info" type="button">📋 複製收成資訊</button>

    ${adminMode ? `
    <label class="harvest-check-row">
      <input type="checkbox" data-role="harvest-checkbox" ${f.harvest ? 'checked' : ''}>
      <span class="harvest-check-label">🧺 已採果</span>
    </label>
    ` : ''}
  </div>`;
}

function render(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  let visibleFields = selectedCategories.size === 0 ? fields : fields.filter(f => selectedCategories.has(f.category));
  const keyword = currentSearch.trim().toLowerCase();
  if(keyword){
    visibleFields = visibleFields.filter(f =>
      f.name.toLowerCase().includes(keyword) ||
      f.species.toLowerCase().includes(keyword)
    );
  }
  if(visibleFields.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('emptyHint').textContent = initialLoading
      ? '🌱 正在讀取花田資料…'
      : (keyword ? '沒有符合搜尋的花田。' : (fields.length === 0 ? '新增第一塊花田，開始記錄採收進度吧。' : '這個分類目前還沒有花田。'));
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = visibleFields.map(cardTemplate).join('');

  grid.querySelectorAll('[data-role="delete"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      deleteField(e.target.closest('.card').dataset.id);
    });
  });
  grid.querySelectorAll('[data-role="harvest-checkbox"]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      toggleStage(e.target.closest('.card').dataset.id, 'harvest');
    });
  });
  grid.querySelectorAll('[data-role="name"]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      renameField(e.target.closest('.card').dataset.id, e.target.value);
    });
  });
  grid.querySelectorAll('[data-role="species"]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      setSpecies(e.target.closest('.card').dataset.id, e.target.value);
    });
  });
  grid.querySelectorAll('[data-role="coords"]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      setCoords(e.target.closest('.card').dataset.id, e.target.value);
    });
  });
  grid.querySelectorAll('[data-role="copy-coords"]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const card = e.target.closest('.card');
      const input = card.querySelector('[data-role="coords"]');
      const value = input.value.trim();
      if(!value){ toast('這塊花田還沒有填座標'); return; }
      try{
        await navigator.clipboard.writeText(value);
        toast('座標已複製');
        e.target.classList.add('copied');
        setTimeout(()=>e.target.classList.remove('copied'), 1200);
      }catch(err){
        input.select();
        document.execCommand('copy');
        toast('座標已複製');
      }
    });
  });
  grid.querySelectorAll('[data-role="drivelink"]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      setDriveLink(e.target.closest('.card').dataset.id, e.target.value);
    });
  });
  grid.querySelectorAll('[data-role="copy-drivelink"]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const card = e.target.closest('.card');
      const input = card.querySelector('[data-role="drivelink"]');
      const value = input.value.trim();
      if(!value){ toast('這塊花田還沒有貼雲端連結'); return; }
      try{
        await navigator.clipboard.writeText(value);
        toast('雲端連結已複製');
        e.target.classList.add('copied');
        setTimeout(()=>e.target.classList.remove('copied'), 1200);
      }catch(err){
        input.select();
        document.execCommand('copy');
        toast('雲端連結已複製');
      }
    });
  });
  grid.querySelectorAll('[data-role="copy-info"]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const id = e.target.closest('.card').dataset.id;
      await copyHarvestInfo(id, e.target);
    });
  });
  grid.querySelectorAll('[data-role="category"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const card = e.target.closest('.card');
      setCategory(card.dataset.id, e.target.dataset.category);
    });
  });
  grid.querySelectorAll('[data-role="start-timer"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const card = e.target.closest('.card');
      startTimer(card.dataset.id, Number(e.target.dataset.minutes));
    });
  });
  grid.querySelectorAll('[data-role="clear-timer"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      clearTimer(e.target.closest('.card').dataset.id);
    });
  });
  grid.querySelectorAll('[data-role="toggle-custom"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.closest('.card').dataset.id;
      if(customOpenIds.has(id)) customOpenIds.delete(id);
      else customOpenIds.add(id);
      render();
    });
  });
  grid.querySelectorAll('[data-role="start-custom"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const card = e.target.closest('.card');
      const h = Number(card.querySelector('[data-role="custom-h"]').value) || 0;
      const m = Number(card.querySelector('[data-role="custom-m"]').value) || 0;
      const total = h*60 + m;
      if(total <= 0){ toast('請輸入時或分'); return; }
      const elapsedMinutes = Math.max(BASELINE_MINUTES - total, 0);
      const plantedAt = Date.now() - elapsedMinutes*60000;
      startTimer(card.dataset.id, total, plantedAt);
    });
  });
}

function formatLogTime(ts){
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

const LOG_PREVIEW_COUNT = 10;
const LOG_MAX_COUNT = 30;

function renderMergedLog(){
  const section = document.getElementById('logSection');
  const listEl = document.getElementById('logList');
  const btn = document.getElementById('logExpandBtn');
  if(!mergedLog.length){
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';

  let filtered = mergedLog;
  if(selectedLogCategories.size > 0){
    filtered = mergedLog.filter(l => {
      const field = fields.find(f => f.id === l.fieldId);
      return field && selectedLogCategories.has(field.category);
    });
  }

  if(!filtered.length){
    listEl.innerHTML = '<li class="log-empty">沒有符合篩選條件的紀錄</li>';
    btn.style.display = 'none';
    return;
  }

  const capped = filtered.slice(0, LOG_MAX_COUNT);
  const shown = logExpanded ? capped : capped.slice(0, LOG_PREVIEW_COUNT);
  listEl.innerHTML = shown.map(l => `
    <li class="log-item" data-field-id="${escapeHtml(l.fieldId || '')}">
      <span class="log-name">🌼<strong>${escapeHtml(l.fieldName)}</strong>${l.species ? `<span class="log-species">・${escapeHtml(l.species)}</span>` : ''}</span>
      <span class="log-badge plant-badge">🌱 ${formatLogTime(l.plantedAt)} 種植</span>
      ${l.harvested ? `<span class="log-badge harvest-badge">🧺 沐沐已採果</span>` : ''}
    </li>`
  ).join('');
  if(capped.length > LOG_PREVIEW_COUNT){
    btn.style.display = 'block';
    btn.textContent = logExpanded ? '收起' : `展開查看更多（共 ${capped.length} 筆）`;
  }else{
    btn.style.display = 'none';
  }
}

function buildLogFilterTabs(){
  const container = document.getElementById('logFilterTabs');
  const allBtn = `<button class="filter-tab active" data-role="log-filter" data-category="all">全部</button>`;
  const catBtns = CATEGORIES.map(c => `<button class="filter-tab" data-role="log-filter" data-category="${c}">${c}</button>`).join('');
  container.innerHTML = allBtn + catBtns;
  container.querySelectorAll('[data-role="log-filter"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const cat = e.target.dataset.category;
      if(cat === 'all'){
        selectedLogCategories.clear();
      }else{
        if(selectedLogCategories.has(cat)) selectedLogCategories.delete(cat);
        else selectedLogCategories.add(cat);
      }
      container.querySelectorAll('[data-role="log-filter"]').forEach(b=>{
        if(b.dataset.category === 'all') b.classList.toggle('active', selectedLogCategories.size === 0);
        else b.classList.toggle('active', selectedLogCategories.has(b.dataset.category));
      });
      renderMergedLog();
    });
  });
}

function startTicker(){
  if(tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(()=>{
    document.querySelectorAll('.card').forEach(card=>{
      const f = fields.find(x=>x.id===card.dataset.id);
      if(!f) return;
      if(f.timerEnd){
        const remaining = f.timerEnd - Date.now();
        const disp = card.querySelector('[data-role="countdown"]');
        if(disp) disp.textContent = formatCountdown(remaining);
      }
      const timeRow = card.querySelector('[data-role="local-time-row"]');
      if(timeRow){
        const lng = parseFloat(timeRow.dataset.lng);
        const timeDisp = card.querySelector('[data-role="local-time"]');
        if(timeDisp) timeDisp.textContent = formatLocalTime(lng);
      }
    });
  }, 1000);
}

document.getElementById('addBtn').addEventListener('click', ()=>{
  const input = document.getElementById('newFieldName');
  const coordsInput = document.getElementById('newFieldCoords');
  const categorySelect = document.getElementById('newFieldCategory');
  const name = input.value.trim();
  const coords = coordsInput.value.trim();
  const category = categorySelect.value;
  if(!name) return;
  addField(name, coords, category);
  input.value = '';
  coordsInput.value = '';
  categorySelect.value = '';
});
document.getElementById('newFieldName').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('addBtn').click();
});
document.getElementById('newFieldCoords').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('addBtn').click();
});
document.getElementById('grid').addEventListener('focusout', e=>{
  const role = e.target.dataset ? e.target.dataset.role : null;
  if(e.target.tagName === 'INPUT' && (role === 'name' || role === 'species' || role === 'coords')){
    setTimeout(()=>{ if(!isEditingField()) render(); }, 150);
  }
});
document.querySelectorAll('[data-role="filter"]').forEach(btn=>{
  btn.addEventListener('click', e=>{
    const cat = e.target.dataset.category;
    if(cat === 'all'){
      selectedCategories.clear();
    }else{
      if(selectedCategories.has(cat)) selectedCategories.delete(cat);
      else selectedCategories.add(cat);
    }
    document.querySelectorAll('[data-role="filter"]').forEach(b=>{
      if(b.dataset.category === 'all'){
        b.classList.toggle('active', selectedCategories.size === 0);
      }else{
        b.classList.toggle('active', selectedCategories.has(b.dataset.category));
      }
    });
    render();
  });
});
document.getElementById('searchInput').addEventListener('input', e=>{
  currentSearch = e.target.value;
  document.getElementById('searchBar').classList.toggle('has-value', currentSearch.length > 0);
  render();
});
document.getElementById('searchClear').addEventListener('click', ()=>{
  currentSearch = '';
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('searchBar').classList.remove('has-value');
  input.focus();
  render();
});
document.getElementById('logExpandBtn').addEventListener('click', ()=>{
  logExpanded = !logExpanded;
  renderMergedLog();
});
document.getElementById('jumpRecordsBtn').addEventListener('click', ()=>{
  document.getElementById('recordsWrap').scrollIntoView({behavior:'smooth', block:'start'});
});
document.getElementById('logList').addEventListener('click', e=>{
  const item = e.target.closest('.log-item');
  if(!item) return;
  const fieldId = item.dataset.fieldId;
  if(fieldId) jumpToCard(fieldId);
});

function jumpToCard(fieldId){
  let cardEl = document.querySelector(`.card[data-id="${fieldId}"]`);
  if(!cardEl){
    selectedCategories.clear();
    currentSearch = '';
    const searchInput = document.getElementById('searchInput');
    searchInput.value = '';
    document.getElementById('searchBar').classList.remove('has-value');
    document.querySelectorAll('[data-role="filter"]').forEach(b=>{
      b.classList.toggle('active', b.dataset.category === 'all');
    });
    render();
    cardEl = document.querySelector(`.card[data-id="${fieldId}"]`);
  }
  if(cardEl){
    cardEl.scrollIntoView({behavior:'smooth', block:'center'});
    const applyHighlight = ()=>{
      cardEl.classList.remove('highlight-flash');
      void cardEl.offsetWidth;
      cardEl.classList.add('highlight-flash');
      setTimeout(()=>cardEl.classList.remove('highlight-flash'), 6000);
    };
    if('onscrollend' in window){
      let done = false;
      const finish = ()=>{
        if(done) return;
        done = true;
        window.removeEventListener('scrollend', finish);
        applyHighlight();
      };
      window.addEventListener('scrollend', finish);
      setTimeout(finish, 1800);
    }else{
      setTimeout(applyHighlight, 700);
    }
  }else{
    toast('找不到這張花田卡片，可能已被刪除');
  }
}

/* ---------- 通關密語鎖 ---------- */
const PASSCODE = '130807';

function checkPasscode(){
  const input = document.getElementById('passcodeInput');
  const val = input.value.trim();
  if(val === PASSCODE){
    document.getElementById('passcodeGate').style.display = 'none';
  }else{
    const box = document.getElementById('passcodeBox');
    document.getElementById('passcodeError').style.display = 'block';
    box.classList.remove('shake');
    void box.offsetWidth;
    box.classList.add('shake');
    input.value = '';
    input.focus();
  }
}
document.getElementById('passcodeSubmit').addEventListener('click', checkPasscode);
document.getElementById('passcodeInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') checkPasscode();
});

buildLogFilterTabs();
loadAdminState();
loadApiUrl();
startTicker();
